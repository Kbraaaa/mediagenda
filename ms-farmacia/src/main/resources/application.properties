spring.application.name=ms-farmacia
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/farmacia_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=15
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:mediagenda}
spring.rabbitmq.password=${RABBIT_PASSWORD:mediagenda}
mediagenda.eventos.exchange=mediagenda.eventos
# rabbit (local) | sqs (AWS). En AWS se activa con el perfil "aws"
mediagenda.mensajeria=${MENSAJERIA:rabbit}
aws.region=${AWS_REGION:us-east-2}
aws.sqs.cola-url=${SQS_COLA_URL:}

# ms-citas (llamada sincrona: la cita debe estar ATENDIDA para formular)
citas.service.url=${CITAS_URL:http://localhost:8082}

farmacia.zona-horaria=America/Bogota

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
