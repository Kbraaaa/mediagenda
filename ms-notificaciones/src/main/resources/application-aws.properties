# Perfil de AWS: eventos por Amazon SQS, correo por Amazon SES y SMS por Amazon SNS (si la cuenta lo permite)
mediagenda.mensajeria=sqs
notificaciones.correo=ses
# SMS: la cuenta del plan gratuito (nueva experiencia de AWS) bloquea el envio de SMS con una
# politica de la organizacion (SCP). Queda simulado; con una cuenta que lo permita: SMS=sns
notificaciones.sms=${SMS:simulado}
management.health.rabbit.enabled=false
# Sin RabbitMQ en AWS: el listener de Rabbit no arranca
spring.rabbitmq.listener.simple.auto-startup=false
