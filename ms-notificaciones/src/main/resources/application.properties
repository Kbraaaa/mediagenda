spring.application.name=ms-notificaciones
server.port=8084

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notificaciones_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RabbitMQ: escucha todos los eventos (cita.*, formula.*)
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:mediagenda}
spring.rabbitmq.password=${RABBIT_PASSWORD:mediagenda}
# Un mensaje que no se puede procesar va a la cola de mensajes muertos, no vuelve a la cola
spring.rabbitmq.listener.simple.default-requeue-rejected=false
mediagenda.eventos.exchange=mediagenda.eventos
notificaciones.cola=notificaciones.q
notificaciones.cola-muertos=notificaciones.dlq
# rabbit (local) | sqs (AWS)
mediagenda.mensajeria=${MENSAJERIA:rabbit}
aws.region=${AWS_REGION:us-east-2}
aws.sqs.cola-url=${SQS_COLA_URL:}
# Dos hilos programados: la lectura de SQS espera hasta 20 s y no debe frenar los reintentos
spring.task.scheduling.pool.size=2

# Correo por SMTP. Local: Mailpit (sin clave). AWS: email-smtp.us-east-2.amazonaws.com:587 con credenciales SMTP de SES
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# smtp (local, Mailpit) | ses (AWS, API de Amazon SES)
notificaciones.correo=${CORREO:smtp}
# simulado (en el log) | telegram (bot de Telegram) | sns (Amazon SNS) | ninguno (sin aviso movil)
notificaciones.sms=${SMS:simulado}
# Bot de Telegram: el token es secreto (solo en el .env); el chat es donde llegan los avisos de la demo
telegram.token=${TELEGRAM_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}
notificaciones.remitente=${CORREO_REMITENTE:no-responder@mediagenda.co}

notificaciones.zona-horaria=America/Bogota
notificaciones.intentos-maximos=3
notificaciones.reintentos.intervalo-ms=300000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# La salud no depende del servidor de correo (si el correo cae, el servicio sigue atendiendo)
management.health.mail.enabled=false
