spring.application.name=ms-citas
server.port=8082

# Base de datos propia (citas_db). Valores reales por variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/citas_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=15
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RabbitMQ (eventos hacia ms-notificaciones)
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:mediagenda}
spring.rabbitmq.password=${RABBIT_PASSWORD:mediagenda}
mediagenda.eventos.exchange=mediagenda.eventos
# rabbit (local) | sqs (AWS). En AWS se activa con el perfil "aws"
mediagenda.mensajeria=${MENSAJERIA:rabbit}
aws.region=${AWS_REGION:us-east-2}
aws.sqs.cola-url=${SQS_COLA_URL:}

# ms-pacientes (llamada sincrona con RestClient)
pacientes.service.url=${PACIENTES_URL:http://localhost:8081}

# API externa 1: festivos de Colombia
festivos.url=${FESTIVOS_URL:https://date.nager.at}
festivos.pais=CO

# API externa 2: IA para el triage (Gemini). Sin clave se usa el triage por reglas.
gemini.habilitado=${GEMINI_HABILITADO:true}
gemini.api-key=${GEMINI_API_KEY:}
gemini.modelo=${GEMINI_MODELO:gemini-3.5-flash-lite}
gemini.url=https://generativelanguage.googleapis.com
# Espera minima entre llamadas, para respetar el limite de la capa gratuita
gemini.intervalo-minimo-ms=${GEMINI_INTERVALO_MS:4000}
triage.intentos=3

# Zona horaria del negocio (el servidor de AWS esta en UTC)
citas.zona-horaria=America/Bogota
citas.recordatorios.intervalo-ms=300000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
