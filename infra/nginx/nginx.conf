# Puerta de entrada unica: enruta cada prefijo de URL a su microservicio.
events {}

http {
    upstream pacientes      { server ms-pacientes:8081; }
    upstream citas          { server ms-citas:8082; }
    upstream farmacia       { server ms-farmacia:8083; }
    upstream notificaciones { server ms-notificaciones:8084; }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        location /api/v1/pacientes      { proxy_pass http://pacientes; }

        location /api/v1/citas          { proxy_pass http://citas; }
        location /api/v1/medicos        { proxy_pass http://citas; }
        location /api/v1/franjas        { proxy_pass http://citas; }

        location /api/v1/formulas       { proxy_pass http://farmacia; }
        location /api/v1/medicamentos   { proxy_pass http://farmacia; }

        location /api/v1/notificaciones { proxy_pass http://notificaciones; }

        location = /salud { return 200 'ok'; add_header Content-Type text/plain; }
    }
}
