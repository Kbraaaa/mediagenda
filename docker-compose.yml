# Entorno completo de MediAgenda.
# En local:  docker compose up -d --build
# En AWS se usa el mismo archivo; la base de datos apunta a RDS desde el .env.
name: mediagenda

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"   # 5433 en tu equipo para no chocar con tu PostgreSQL local
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-mediagenda}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-mediagenda}
    ports:
      - "15672:15672" # consola web de RabbitMQ
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  ms-pacientes:
    build: ./ms-pacientes
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/pacientes_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      retries: 12

  ms-citas:
    build: ./ms-citas
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/citas_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER:-mediagenda}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-mediagenda}
      PACIENTES_URL: http://ms-pacientes:8081
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_HABILITADO: ${GEMINI_HABILITADO:-true}
      GEMINI_MODELO: ${GEMINI_MODELO:-gemini-3.5-flash-lite}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      retries: 12

  ms-farmacia:
    build: ./ms-farmacia
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/farmacia_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER:-mediagenda}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-mediagenda}
      CITAS_URL: http://ms-citas:8082
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      retries: 12

  # Buzon de correo de prueba: los avisos se ven en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  ms-notificaciones:
    build: ./ms-notificaciones
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/notificaciones_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER:-mediagenda}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-mediagenda}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_TLS: ${SMTP_TLS:-false}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-no-responder@mediagenda.co}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      retries: 12

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8000}:80"   # en tu equipo: 8000; en AWS se pone HTTP_PORT=80
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ms-pacientes
      - ms-citas
      - ms-farmacia
      - ms-notificaciones

volumes:
  pgdata:
