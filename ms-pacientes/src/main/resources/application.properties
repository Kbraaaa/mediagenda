spring.application.name=ms-pacientes
server.port=8081

# Conexion a PostgreSQL. Los valores reales vienen de variables de entorno (.env / AWS).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pacientes_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10

# Las tablas las crea Flyway (src/main/resources/db/migration); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Salud del servicio (la usan Docker y el pipeline de despliegue)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
